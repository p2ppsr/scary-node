# Both miners use this endpoint. The shared proxy clock gives ingress estimates
# with millisecond precision even when the RPC finishes at different times.
server {
    listen 19461;
    resolver 127.0.0.11 valid=3s ipv6=off;
    location / {
        set $arbiter judge:18332;
        proxy_pass http://$arbiter;
        add_header X-Race-Proxy-Time $msec always;
        add_header X-Race-Request-Time $request_time always;
    }
}

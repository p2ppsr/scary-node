services:
  judge:
    image: bitcoinsv/bitcoin-sv:1.2.3@sha256:d96fe4786a00e5fc10bc9e0e76a6006376f9472d4eb74d07e4c1e0d019493d33
    platform: linux/amd64
    entrypoint: [bitcoind]
    command:
      - -regtest
      - -datadir=/data
      - -server=1
      - -listen=0
      - -dnsseed=0
      - -discover=0
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=18332
      - -rpcuser=regtest
      - -rpcpassword=disposable-regtest-rpc
      - -excessiveblocksize=20000000
      - -maxstackmemoryusageconsensus=100000000
      - -minminingtxfee=0.00000500
      - -printtoconsole
    networks: [regtest]
    tmpfs: [/data]
  ingress:
    volumes:
      - ./race-ingress.conf:/etc/nginx/scary-lab-http/race.conf:ro
    ports: !override
      - 127.0.0.1:19641:19441
      - 127.0.0.1:19642:19442
      - 127.0.0.1:19651:19451
      - 127.0.0.1:19652:19452
      - 127.0.0.1:19633:19433
      - 127.0.0.1:19680:19480
      - 127.0.0.1:19661:19461

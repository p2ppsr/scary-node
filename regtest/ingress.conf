# Only this forwarder has a host-facing interface. Docker DNS resolves each
# destination on demand, including the entrant when it starts mid-proof.
worker_processes 1;
events { worker_connections 256; }
stream {
    resolver 127.0.0.11 valid=3s ipv6=off;
    include /etc/nginx/scary-lab/*.conf;
    server { listen 19441; set $dest tn1:9292; proxy_pass $dest; }
    server { listen 19442; set $dest tn2:9292; proxy_pass $dest; }
    server { listen 19451; set $dest tn1:8090; proxy_pass $dest; }
    server { listen 19452; set $dest tn2:8090; proxy_pass $dest; }
    server { listen 19480; set $dest scary-node:8080; proxy_pass $dest; }
    server { listen 19433; set $dest scary-node:3333; proxy_pass $dest; }
}

http {
    include /etc/nginx/scary-lab-http/*.conf;
}

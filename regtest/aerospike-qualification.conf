# Single-server, disk-backed UTXO namespace per isolated Teranode.
service {
    cluster-name docker
    service-threads 8
    proto-fd-max 15000
}
logging {
    console {
        context any info
    }
}
network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}
namespace test {
    default-ttl 0
    evict-indexes-memory-pct 100
    nsup-period 10
    nsup-threads 8
    truncate-threads 8
    transaction-pending-limit 0
    replication-factor 1
    partition-tree-sprigs 1024
    stop-writes-sys-memory-pct 100
    storage-engine device {
        file /opt/aerospike/data/utxostore.dat
        defrag-lwm-pct 50
        evict-used-pct 100
        filesize 9G
        flush-size 128K
        stop-writes-avail-pct 5
        stop-writes-used-pct 100
        max-write-cache 1024M
    }
}

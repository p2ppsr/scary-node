[package]
name = "scary-node"
version = "0.1.0-alpha.3"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/p2ppsr/scary-node"
description = "A witnessed-output BSV mining node with native Teranode peering and Stratum V1"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bsv-sdk = { git = "https://github.com/bsv-blockchain/rs-sdk", rev = "99d2313f2ede48a465aa8be1907d26d098aac8fd" }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "system-config"] }
libp2p = { version = "0.56", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "identify", "dns", "macros", "ed25519"] }
num-bigint = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
